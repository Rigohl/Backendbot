name: BackendBot CI

on:
  push:
    branches: [ main, copilot/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Initialize backendbot data defaults
        run: |
          import sys, shutil, os
          sys.path.insert(0,'src')
          data_dir = os.path.join(os.getcwd(), '.backendbot_data')
          if os.path.exists(data_dir):
              shutil.rmtree(data_dir)
          os.makedirs(data_dir, exist_ok=True)
          from backendbot.utils.data_store import initialize_defaults
          initialize_defaults()
      - name: Run ruff lint
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          ruff --version
          ruff check src tests || true
      - name: Run tests
        env:
          PYTHONPATH: src
        run: |
          pytest -q
