[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # Isort
    "C",  # Complexity
    "N",  # Naming
    "D",  # pydocstyle
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "A",  # flake8-builtins
    "ANN",# flake8-annotations
    "ASYNC", # flake8-async
    "C4", # flake8-comprehensions
    "DTZ",# flake8-datetimez
    "ERA",# eradicate
    "ISC",# flake8-implicit-str-concat
    "ICN",# flake8-import-conventions
    "PIE",# flake8-pie
    "PL", # Pylint
    "PT", # flake8-pytest-style
    "RSE",# flake8-raise
    "RET",# flake8-return
    "SLF",# flake8-self
    "SIM",# flake8-simplify
    "TID",# flake8-tidy-imports
    "TCH",# flake8-type-checking
    "PTH",# flake8-use-pathlib
    "RUF",# Ruff-specific rules
]
ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
    "D105", # Missing docstring in magic method
    "D107", # Missing docstring in __init__
    "D203", # Incompatible con D211
    "D213", # Incompatible con D212
    "B008", # FastAPI Depends in defaults is acceptable pattern
    "C901", # Complexity checks can be too strict
    "PLW2901", # Reassigning loop variable is common in parsing
]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "venv",
    ".venv",
    "docs",
    "scripts",
    "dashboard",
    "logs",
    "data",
    "tests", # Excluir tests por ahora, podemos añadir reglas específicas después
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"src/backendbot/main.py" = ["D100"]
"src/backendbot/api_routes.py" = ["D100"]
"src/backendbot/process_routes.py" = ["D100"]
"src/backendbot/tray_icon.py" = ["D100"]
"src/backendbot/watchdog.py" = ["D100"]
"src/backendbot/utils.py" = ["D100"]
"src/backendbot/config.py" = ["D100"]
