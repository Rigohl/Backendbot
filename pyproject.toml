[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backendbot"
version = "0.1.0"
description = "BackendBot - System monitoring and AI agent"
authors = [
    {name = "Rigohl", email = "your-email@example.com"},
]
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "psutil==7.0.0",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "sqlalchemy==2.0.43",
    "python-multipart==0.0.6",
    "python-dotenv==1.1.1",
    "httpx==0.25.2",
    "gunicorn==21.2.0",
    "uvloop==0.17.0",
    "httptools==0.6.1",
]
requires-python = ">=3.11"
readme = "README.md"

[project.optional-dependencies]
dev = [
    "ruff==0.13.0",
    "black==25.1.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.black]
line-length = 88
target-version = ['py311']